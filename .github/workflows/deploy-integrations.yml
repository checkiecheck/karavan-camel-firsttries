name: Build and Deploy Changed Integrations

on:
  push:
    branches:
      - main
      - master

# GHCR bij de repo (ghcr.io/<owner>/<repo>); een klant die lokale/air-gapped
# images wil (bv. politie) krijgt dezelfde image later via een aparte
# registry-spiegel — de build zelf verandert dan niet.
env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}   # owner/repo, lowercase verplicht
  NAMESPACE: integration

jobs:
  # ---- Build: gehosted, heeft alleen GHCR nodig ----
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      changed-dirs: ${{ steps.detect.outputs.changed-dirs }}
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detecteer gewijzigde integraties
        id: detect
        run: |
          CHANGED_DIRS=$(git diff --name-only HEAD^ HEAD | awk -F'/' '{print $1}' | sort -u)
          # filter op echte integratie-directories (application.properties aanwezig)
          VALID=""
          for d in $CHANGED_DIRS; do
            [ -f "$d/application.properties" ] && VALID="$VALID $d"
          done
          echo "changed-dirs=$VALID" >> "$GITHUB_OUTPUT"
          echo "Gewijzigde integraties:$VALID"

      - name: Registry login (GHCR bij de repo)
        if: steps.detect.outputs.changed-dirs != ''
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Dependency-check & route-tests per integratie
        if: steps.detect.outputs.changed-dirs != ''
        run: |
          IMAGE_NS_LC=$(echo "${IMAGE_NAMESPACE}" | tr '[:upper:]' '[:lower:]')

          for APP_NAME in ${{ steps.detect.outputs.changed-dirs }}; do
            echo "=== Testing $APP_NAME ==="
            # 1. JBang- vs pom-consistentiecheck
            bash scripts/check-jbang-deps.sh "$APP_NAME"

            # 1b. Productie-route(s) op het test-classpath zetten:
            #     camel-quarkus laadt routes van classpath:camel/*.yaml,
            #     in de repo liggen ze plat in de integratie-directory.
            #     DEV-mocks (mock-*.camel.yaml) NIET meenemen.
            mkdir -p "$APP_NAME/src/main/resources/camel"
            for f in "$APP_NAME"/*.camel.yaml; do
              case "$(basename "$f")" in mock-*) ;; *) cp "$f" "$APP_NAME/src/main/resources/camel/" ;; esac
            done

            # 2. Route-tests (JUnit/CamelQuarkusTestSupport): faalt een test,
            #    dan stopt de pipeline HIER - geen image-build, geen push, geen deploy
            docker run --rm \
              -v "$PWD/$APP_NAME:/workspace" \
              -w /workspace \
              -v maven-cache:/root/.m2 \
              docker.io/library/maven:3.9-eclipse-temurin-21 \
              mvn -B test
          done

      - name: Container build per integratie (alleen na geslaagde tests)
        if: steps.detect.outputs.changed-dirs != ''
        run: |
          IMAGE_NS_LC=$(echo "${IMAGE_NAMESPACE}" | tr '[:upper:]' '[:lower:]')

          for APP_NAME in ${{ steps.detect.outputs.changed-dirs }}; do
            echo "=== Building $APP_NAME ==="
            IMAGE_NAME="${REGISTRY}/${IMAGE_NS_LC}/${APP_NAME}:${GITHUB_SHA::7}"
            docker build -t "$IMAGE_NAME" "$APP_NAME"
            docker push "$IMAGE_NAME"
          done

  # ---- Deploy: self-hosted runner in het k3s-netwerk (pollt uitgaand bij GitHub) ----
  deploy:
    needs: build
    if: needs.build.outputs.changed-dirs != ''
    runs-on: self-hosted
    concurrency:
      group: deploy-integration-ns
      cancel-in-progress: false
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Configureer kubectl (kubeconfig uit secret, plain YAML)
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "KUBE_CONFIG secret is leeg of ontbreekt"; exit 1
          fi
          # accepteer óók per ongeluk base64-gecodeerde secrets
          if echo "${{ secrets.KUBE_CONFIG }}" | head -1 | grep -qE '^[A-Za-z0-9+/=]+$'; then
            echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config 2>/dev/null || \
              echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          else
            echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          fi
          chmod 600 ~/.kube/config
          # sanity: cluster moet bereikbaar zijn, anders duidelijke fout
          kubectl cluster-info || { echo "k3s API niet bereikbaar vanaf de runner — check server:-URL in de kubeconfig"; exit 1; }

      - name: Deploy per integratie
        run: |
          IMAGE_NS_LC=$(echo "${IMAGE_NAMESPACE}" | tr '[:upper:]' '[:lower:]')

          for APP_NAME in ${{ needs.build.outputs.changed-dirs }}; do
            echo "=== Deploying $APP_NAME ==="
            IMAGE_NAME="${REGISTRY}/${IMAGE_NS_LC}/${APP_NAME}:${GITHUB_SHA::7}"

            # Directory met eigen k8s/ wint (volledige controle incl. Kong CRDs);
            # anders geldt het generieke manifest hieronder.
            if [ -d "$APP_NAME/k8s" ]; then
              grep -rl '<CA_CERTIFICATE_ID>' "$APP_NAME/k8s" | while read -r f; do
                sed -i "s/<CA_CERTIFICATE_ID>/${{ secrets.KONG_CA_UUID }}/" "$f"
              done
              grep -rl '<IMAGE>' "$APP_NAME/k8s" | while read -r f; do
                sed -i "s#<IMAGE>#${IMAGE_NAME}#" "$f"
              done
              kubectl apply -n ${NAMESPACE} -f "$APP_NAME/k8s/"
              kubectl set image deployment/${APP_NAME} camel-route=${IMAGE_NAME} -n ${NAMESPACE}
            else
              cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${APP_NAME}
            namespace: ${NAMESPACE}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: ${APP_NAME}
            template:
              metadata:
                labels:
                  app: ${APP_NAME}
              spec:
                containers:
                - name: camel-route
                  image: ${IMAGE_NAME}
                  imagePullPolicy: Always
                  ports:
                  - containerPort: 8080
                  envFrom:
                  - configMapRef:
                      name: ${APP_NAME}-config
                  env:
                  - name: POD_NAME
                    value: ${APP_NAME}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: ${APP_NAME}-svc
            namespace: ${NAMESPACE}
          spec:
            type: ClusterIP
            ports:
            - port: 8080
              targetPort: 8080
            selector:
              app: ${APP_NAME}
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: ${APP_NAME}-ingress
            namespace: ${NAMESPACE}
            annotations:
              konghq.com/strip-path: "true"
          spec:
            ingressClassName: kong
            rules:
            - http:
                paths:
                - path: /${APP_NAME}
                  pathType: Prefix
                  backend:
                  service:
                      name: ${APP_NAME}-svc
                      port:
                        number: 8080
          EOF
              kubectl rollout restart deployment/${APP_NAME} -n ${NAMESPACE}
            fi

            kubectl rollout status deployment/${APP_NAME} -n ${NAMESPACE} --timeout=120s
          done
