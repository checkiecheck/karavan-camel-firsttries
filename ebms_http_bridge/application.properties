# ebms_http_bridge - configuratie (Quarkus runtime)
# Laag 1: Camel placeholders {{key}} in de camel.yaml (default: {{key:default}})
# Laag 2: ${ENV_VAR:default} met safe defaults (geen echte credentials in de repo)
# Laag 3: env vars via K8s ConfigMap/Secret of docker
#
# APP-REGISTRY (keuze 4a): per app een blok hieronder. Nieuwe app = blok kopieren
# + route-paar kopieren in ebms_http_bridge.camel.yaml + ConfigMap-entry in k8s.

# --- Camel JBang dev-loop (Karavan): zelfde componenten als de pom.xml ---
# (patroon 10/11: camel:x hier = camel-quarkus-x in pom.xml; file is core-exempt)
# Alleen de productie-route laden (mock-*.camel.yaml is DEV-only: wel op
# classpath door de pom-resources, dus expliciet includen - zelfde patroon als rabbitmq_elastic).
camel.main.routes-include-pattern=classpath:ebms_http_bridge.camel.yaml
camel.jbang.dependencies=camel:spring-rabbitmq,camel:netty-http,camel:file

# --- RabbitMQ connectie (voor de CachingConnectionFactory-bean) ---
rabbitmq.host=${RABBITMQ_HOST:localhost}
rabbitmq.port=${RABBITMQ_PORT:5672}
rabbitmq.vhost=${RABBITMQ_VHOST:/}
rabbitmq.username=${RABBITMQ_USERNAME:guest}
rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# --- Notify-sink (keuze 3): falende afleveringen naar tekstbestand voor beheer ---
ebms.notify.fileUri=${EBMS_NOTIFY_FILE_URI:file:/tmp/ebms-notify?fileExist=Append&charset=utf-8}

# ---------------------------------------------------------------
# APP: demo (voorbeeld-instantie van het route-paar-template)
# ---------------------------------------------------------------
ebms.demo.exchange=${EBMS_DEMO_EXCHANGE:ebms.events}
ebms.demo.queue=${EBMS_DEMO_QUEUE:ebms.demo.out}
ebms.demo.endpointUrl=${EBMS_DEMO_ENDPOINT_URL:http://localhost:18081/api/ebms}
ebms.demo.dlx.exchange=${EBMS_DEMO_DLX_EXCHANGE:ebms.demo.dlx}
ebms.demo.dlx.routingKey=${EBMS_DEMO_DLX_ROUTING_KEY:dead}
ebms.demo.prefetchCount=${EBMS_DEMO_PREFETCH_COUNT:1}
ebms.demo.consumers=${EBMS_DEMO_CONSUMERS:1}

# --- Structured logging: native JSON voor Filebeat (patroon 4) ---
quarkus.log.console.json=${LOG_JSON:true}
quarkus.log.console.json.pretty-print=false
quarkus.log.level=${LOG_LEVEL:INFO}
