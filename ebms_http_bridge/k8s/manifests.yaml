# ebms_http_bridge/k8s/ - volledige manifesten voor de generieke monorepo-workflow.
# Placeholder die de workflow substitueert:
#   <IMAGE> -> ghcr.io/<owner>/<repo>/<app>:<sha>
# Overige configuratie via env vars (ConfigMap hieronder).
#
# Let op: messaging-worker - GEEN Ingress/Kong nodig. Poort 8080 is alleen
# voor de health-probes (quarkus-smallrye-health).

# --- ConfigMap: per-app configuratie (vult envFrom in de Deployment) ---
# APP-REGISTRY: nieuwe app = blok toevoegen (en route-paar + properties, zie README).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ebms-http-bridge-config
  namespace: integration
data:
  RABBITMQ_HOST: "rabbitmq.integration.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "/"
  EBMS_NOTIFY_FILE_URI: "file:/var/ebms/notify?fileExist=Append&charset=utf-8"
  # APP: demo
  EBMS_DEMO_EXCHANGE: "ebms.events"
  EBMS_DEMO_QUEUE: "ebms.demo.out"
  EBMS_DEMO_ENDPOINT_URL: "http://demo-app.integration.svc.cluster.local:8080/api/ebms"
  EBMS_DEMO_DLX_EXCHANGE: "ebms.demo.dlx"
  EBMS_DEMO_DLX_ROUTING_KEY: "dead"
  EBMS_DEMO_CONSUMERS: "1"
  LOG_JSON: "true"
  LOG_LEVEL: "INFO"
  # Credentials staan NIET hier (ConfigMap is plain text in de repo):
  # RABBITMQ_USERNAME/RABBITMQ_PASSWORD komen uit de Secret hieronder.
---
# --- Secret: credentials - alleen extern vullen, NIET committen! ---
# kubectl -n integration create secret generic ebms-http-bridge-secrets \
#   --from-literal=RABBITMQ_USERNAME='<user>' \
#   --from-literal=RABBITMQ_PASSWORD='<pass>'
apiVersion: v1
kind: Secret
metadata:
  name: ebms-http-bridge-secrets
  namespace: integration
type: Opaque
# Bestaat alleen als referentie hier; echte waarden via kubectl create secret
# of een external-secrets/sealed-secrets oplossing. Een lege Secret is prima:
# ontbrekende env vars vallen terug op de safe defaults uit application.properties.
stringData: {}
---
# --- Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ebms-http-bridge
  namespace: integration
  labels:
    app: ebms-http-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ebms-http-bridge
  template:
    metadata:
      labels:
        app: ebms-http-bridge
    spec:
      containers:
        - name: camel-route
          image: <IMAGE>
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: ebms-http-bridge-config
            - secretRef:
                name: ebms-http-bridge-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
          # Notify-sink: falende afleveringen landen hier (keuze 3: tekstbestand
          # voor beheer tot er een echte notificatie-kanaal is).
          volumeMounts:
            - name: ebms-notify
              mountPath: /var/ebms/notify
      volumes:
        - name: ebms-notify
          emptyDir: {}
---
# --- Service (alleen voor probes/interne diagnostiek, geen Ingress) ---
apiVersion: v1
kind: Service
metadata:
  name: ebms-http-bridge-svc
  namespace: integration
  labels:
    app: ebms-http-bridge
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: ebms-http-bridge
