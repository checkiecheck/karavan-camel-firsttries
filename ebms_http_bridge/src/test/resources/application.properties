# Test-configuratie voor de route-tests (wint van productie-properties bij QuarkusTest).
# De RabbitMQ-consumer en de HTTP-producer worden geadviced naar inline mocks -
# geen broker of legacy-app nodig.
rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.vhost=/
rabbitmq.username=guest
rabbitmq.password=guest

ebms.notify.fileUri=file:target/ebms-notify-test?fileExist=Append&charset=utf-8

ebms.demo.exchange=ebms.events
ebms.demo.queue=ebms.demo.out
ebms.demo.endpointUrl=http://localhost:18081/api/ebms
ebms.demo.dlx.exchange=ebms.demo.dlx
ebms.demo.dlx.routingKey=dead

quarkus.log.console.json=false
quarkus.log.level=WARN
