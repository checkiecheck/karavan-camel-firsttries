# IEEE 2030.5 proxy - configuratie (Quarkus runtime)
# Laag 1: Camel placeholders {{key}} in camel.yaml
# Laag 2: Spring-style ${ENV_VAR:default} met safe defaults
# Laag 3: env vars via K8s/docker

# Proxy listener (HTTP — mTLS wordt afgevangen door Kong Ingress)
ieee2030.proxy.port=${IEEE2030_PROXY_PORT:8080}

# Header waarin Kong het CN van het client-certificaat doorgeeft
ieee2030.client.cn.header=${IEEE2030_CN_HEADER:X-Client-CN}

# CN-allowlist: komma-gescheiden. Leeg = alleen 'CN aanwezig' (PKI-trustbased).
# Gevuld = expliciete toelating; bron = ConfigMap (repo, reviewable) of Secret.
ieee2030.cn.allowlist=${IEEE2030_CN_ALLOWLIST:}

# SEP2 target server (IEEE 2030.5 draait normaal HTTPS met mutual TLS)
ieee2030.target.base=${IEEE2030_TARGET_BASE:https://127.0.0.1:8443}
ieee2030.target.host=${IEEE2030_TARGET_HOST:127.0.0.1}
ieee2030.target.port=${IEEE2030_TARGET_PORT:8443}
ieee2030.target.tls=${IEEE2030_TARGET_TLS:true}

# Structured logging (JSON voor Filebeat/ELK) - Quarkus native, geen logback
quarkus.log.console.json=${LOG_JSON:true}
quarkus.log.console.json.pretty-print=false
quarkus.log.level=${LOG_LEVEL:INFO}
