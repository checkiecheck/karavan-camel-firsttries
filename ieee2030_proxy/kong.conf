# kong.conf — mTLS afdwingen op Nginx-niveau i.p.v. de Enterprise mtls-plugin.
# Syntax: nginx_<context>_<directive> injecteert de directive in de
# bijbehorende Nginx context. ssl_* hoort in de server-block van de
# proxy-listener -> nginx_proxy_*.

# CA waarmee client-certificaten worden geverifieerd
# (pad BINNEN de Kong-container; mount de pem via een ConfigMap/secret)
nginx_proxy_ssl_client_certificate = /kong/certs/ieee2030-ca.pem

# Verificatie-modus: kies bewust!
#   on       = hard afgedwongen: ALLE routes op deze Kong vereisen een geldig cert
#   optional = cert wordt gevalideerd indien gepresenteerd, maar niet verplicht;
#               per-route-verplichting regel je daarna in Lua (zie hieronder)
nginx_proxy_ssl_verify_client = on

# Verificatiediepte in de certificaatketen (0 = direct door de CA ondertekend)
nginx_proxy_ssl_verify_depth = 1

# Share nog een sessie/cache (performance bij veel SEP2-poll-verzoeken)
nginx_proxy_ssl_session_cache = shared:SSL:10m
nginx_proxy_ssl_session_timeout = 10m

