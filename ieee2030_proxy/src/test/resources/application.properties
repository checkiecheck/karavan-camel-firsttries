# Test-configuratie voor de route-tests (wint van src/main/resources bij QuarkusTest).
# Poort anders dan productie-default om conflicts met een draaiende dev-instantie te voorkomen.
ieee2030.proxy.port=18080

# Allowlist GEVULD in test: alleen deze twee CN's mogen door.
# (Lege allowlist = trustbased; gevulde = expliciete toelating - beide paden dus testbaar.)
ieee2030.cn.allowlist=device-test-a,device-test-b

# Target = de mockserver die de test zelf start (jdk HttpServer op 19443);
# zelfde rol als mock-sep2-target.camel.yaml in de Karavan-dev-loop.
ieee2030.target.base=http://localhost:19443
ieee2030.target.host=localhost
ieee2030.target.port=19443
ieee2030.target.tls=false

quarkus.log.console.json=false
quarkus.log.level=WARN
