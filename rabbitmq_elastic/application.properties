# rabbitmq_elastic - configuratie (Quarkus runtime)
# Laag 1: Camel placeholders {{key}} in de camel.yaml (default: {{key:default}})
# Laag 2: ${ENV_VAR:default} met safe defaults (geen echte credentials in de repo)
# Laag 3: env vars via K8s ConfigMap/Secret of docker

# --- Camel JBang dev-loop (Karavan): zelfde componenten als de pom.xml ---
# (patroon 10/11: camel:x hier = camel-quarkus-x in pom.xml)
camel.jbang.dependencies=camel:spring-rabbitmq,camel:elasticsearch-rest-client

# --- RabbitMQ connectie (voor de CachingConnectionFactory-bean) ---
rabbitmq.host=${RABBITMQ_HOST:localhost}
rabbitmq.port=${RABBITMQ_PORT:5672}
rabbitmq.vhost=${RABBITMQ_VHOST:/}
rabbitmq.username=${RABBITMQ_USERNAME:guest}
rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# --- RabbitMQ bron (consumeert) ---
rabbitmq.exchange=${RABBITMQ_EXCHANGE:orders.events}
rabbitmq.queue=${RABBITMQ_QUEUE:orders-to-elastic}
rabbitmq.routingKey=${RABBITMQ_ROUTING_KEY:order.#}
rabbitmq.declare=${RABBITMQ_DECLARE:false}
rabbitmq.prefetchCount=${RABBITMQ_PREFETCH_COUNT:10}
rabbitmq.consumers=${RABBITMQ_CONSUMERS:1}

# --- RabbitMQ dead-letter exchange (producer bij falen) ---
rabbitmq.dlx.exchange=${RABBITMQ_DLX_EXCHANGE:orders.dlx}
rabbitmq.dlx.routingKey=${RABBITMQ_DLX_ROUTING_KEY:dead}

# --- Elasticsearch doel (indexeert) ---
es.clusterName=${ES_CLUSTER_NAME:docker-cluster}
es.index=${ES_INDEX:orders}
es.host=${ES_HOST:localhost:9200}
es.username=${ES_USERNAME:elastic}
es.password=${ES_PASSWORD:elastic}
es.connectionTimeout=${ES_CONNECTION_TIMEOUT:5000}
es.socketTimeout=${ES_SOCKET_TIMEOUT:30000}

# --- Structured logging: native JSON voor Filebeat (patroon 4) ---
quarkus.log.console.json=${LOG_JSON:true}
quarkus.log.console.json.pretty-print=false
quarkus.log.level=${LOG_LEVEL:INFO}
