# =========================================================
# RabbitMQ -> Elasticsearch integratie parameters
# Alle waarden overschrijfbaar via env vars (bijv. RABBITMQ_HOST)
# =========================================================

rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.vhost=/
rabbitmq.exchange=orders.events
rabbitmq.queue=orders-to-elastic
rabbitmq.routingKey=order.#
rabbitmq.dlx.exchange=orders.events.dlx
rabbitmq.dlx.routingKey=dead
rabbitmq.username=guest
rabbitmq.password=guest
rabbitmq.declare=false
rabbitmq.prefetchCount=10
rabbitmq.consumers=1

es.clusterName=elastic-cluster
es.host=https://elastic.example.com:9200
es.index=orders
es.username=
es.password=
es.connectionTimeout=5000
es.socketTimeout=30000

spring.application.name=rabbitmq-elastic
camel.main.name=rabbitmq-elastic

# =========================================================
# Structured JSON logging (voor Filebeat) - per runtime
# =========================================================

# --- Camel JBang (lokaal runnen: camel jbang run) ---
camel.jbang.logging-json=true
camel.jbang.logging-color=false

# --- Quarkus runtime (Camel-K / Karavan Quarkus project) ---
# Ingebouwde JSON-formatter, geen extra dependency of logback nodig
quarkus.log.console.json=true
quarkus.log.console.json.pretty-print=false
quarkus.log.level=INFO

# --- Spring Boot runtime (alleen als runtime=Spring Boot) ---
# Native structured logging (Spring Boot 3.4+), geen logback-spring.xml nodig
#logging.structured.format.console=logstash

# --- Camel-K Integration CR (kamel run) ---
# -p quarkus.log.console.json=true -p quarkus.log.level=INFO
