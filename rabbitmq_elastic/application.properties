rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.vhost=/
rabbitmq.exchange=orders.events
rabbitmq.queue=orders-to-elastic
rabbitmq.routingKey=order.#
rabbitmq.dlx.exchange=orders.events.dlx
rabbitmq.dlx.routingKey=dead
rabbitmq.username=guest
rabbitmq.password=guest
rabbitmq.declare=false
rabbitmq.prefetchCount=10
rabbitmq.consumers=1

es.clusterName=elastic-cluster
es.host=https://elastic.example.com:9200
es.index=orders
es.username=
es.password=
es.connectionTimeout=5000
es.socketTimeout=30000

spring.application.name=rabbitmq-elastic
camel.main.name=rabbitmq-elastic
