# =========================================================
# RabbitMQ -> Elasticsearch integratie parameters
# Patroon: ${ENV_VAR:default} - omgevingsvariabele met fallback,
# zodat de app out-of-the-box draait maar in productie via env
# geconfigureerd wordt (K8s secrets, docker-compose, etc.)
# =========================================================

# --- RabbitMQ ---
rabbitmq.host=${RABBITMQ_HOST:localhost}
rabbitmq.port=${RABBITMQ_PORT:5672}
rabbitmq.vhost=${RABBITMQ_VHOST:/}
rabbitmq.exchange=${RABBITMQ_EXCHANGE:orders.events}
rabbitmq.queue=${RABBITMQ_QUEUE:orders-to-elastic}
rabbitmq.routingKey=${RABBITMQ_ROUTING_KEY:order.#}
rabbitmq.dlx.exchange=${RABBITMQ_DLX_EXCHANGE:orders.events.dlx}
rabbitmq.dlx.routingKey=${RABBITMQ_DLX_ROUTING_KEY:dead}
rabbitmq.username=${RABBITMQ_USERNAME:guest}
rabbitmq.password=${RABBITMQ_PASSWORD:guest}
rabbitmq.declare=${RABBITMQ_DECLARE:false}
rabbitmq.prefetchCount=${RABBITMQ_PREFETCH_COUNT:10}
rabbitmq.consumers=${RABBITMQ_CONSUMERS:1}

# --- Elasticsearch ---
es.clusterName=${ES_CLUSTER_NAME:elastic-cluster}
es.host=${ELASTICSEARCH_HOST:https://elastic.example.com:9200}
es.index=${ELASTICSEARCH_INDEX:orders}
es.username=${ELASTICSEARCH_USERNAME:}
es.password=${ELASTICSEARCH_PASSWORD:}
es.connectionTimeout=${ES_CONNECTION_TIMEOUT:5000}
es.socketTimeout=${ES_SOCKET_TIMEOUT:30000}

spring.application.name=${APP_NAME:rabbitmq-elastic}
camel.main.name=rabbitmq-elastic

# =========================================================
# Structured JSON logging (voor Filebeat) - per runtime
# =========================================================

# --- Camel JBang (lokaal runnen: camel jbang run) ---
camel.jbang.logging-json=true
camel.jbang.logging-color=false

# --- Quarkus runtime (Camel-K / Karavan Quarkus project) ---
# Ingebouwde JSON-formatter, geen extra dependency of logback nodig
quarkus.log.console.json=${LOG_JSON:true}
quarkus.log.console.json.pretty-print=${LOG_JSON_PRETTY:false}
quarkus.log.level=${LOG_LEVEL:INFO}

# --- Spring Boot runtime (alleen als runtime=Spring Boot) ---
# Native structured logging (Spring Boot 3.4+), geen logback-spring.xml nodig
#logging.structured.format.console=logstash

# --- Camel-K Integration CR (kamel run) ---
