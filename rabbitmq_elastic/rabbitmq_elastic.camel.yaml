- onException:
    exception:
    - java.io.IOException
    - java.util.concurrent.TimeoutException
    - org.apache.camel.CamelExecutionException
    handled:
      constant: 'true'
    steps:
    - log: 'event=message-failed level=ERROR exchangeId=${exchangeId} correlationId=${header.X-Correlation-Id} index={{es.index}} failedEndpoint=${exchangeProperty.CamelFailureEndpoint} errorMessage=${exception.message}'
    - to:
        uri: rabbitmq://{{rabbitmq.host}}:{{rabbitmq.port}}/{{rabbitmq.dlx.exchange}}
        parameters:
          routingKey: '{{rabbitmq.dlx.routingKey}}'
          username: '{{rabbitmq.username}}'
          password: '{{rabbitmq.password}}'
          vhost: '{{rabbitmq.vhost}}'
          skipQueueDeclare: 'true'

- from:
    uri: rabbitmq://{{rabbitmq.host}}:{{rabbitmq.port}}/{{rabbitmq.exchange}}
    parameters:
      queue: '{{rabbitmq.queue}}'
      routingKey: '{{rabbitmq.routingKey}}'
      username: '{{rabbitmq.username}}'
      password: '{{rabbitmq.password}}'
      vhost: '{{rabbitmq.vhost}}'
      autoDelete: 'false'
      declare: '{{rabbitmq.declare:false}}'
      prefetchEnabled: 'true'
      prefetchCount: '{{rabbitmq.prefetchCount:10}}'
      consumers: '{{rabbitmq.consumers:1}}'
    id: rabbitmq-to-elastic
    group: integration
    steps:
    - setHeader:
        name: X-Correlation-Id
        simple: '${exchangeId}'
    - log: 'event=message-received exchangeId=${exchangeId} correlationId=${header.X-Correlation-Id} routingKey=${header.rabbitmq.RoutingKey} queue={{rabbitmq.queue}}'
    - setHeader:
        name: ElasticsearchOperation
        constant: 'Index'
    - setHeader:
        name: ElasticsearchIndex
        constant: '{{es.index}}'
    - setHeader:
        name: ElasticsearchDocumentId
        simple: '${header.X-Correlation-Id}'
    - to:
        uri: elasticsearch-rest-client:{{es.clusterName}}
        parameters:
          operation: 'Index'
          index: '{{es.index}}'
          hostAddresses: '{{es.host}}'
          user: '{{es.username}}'
          password: '{{es.password}}'
          connectionTimeout: '{{es.connectionTimeout:5000}}'
          socketTimeout: '{{es.socketTimeout:30000}}'
    - log: 'event=message-indexed exchangeId=${exchangeId} correlationId=${header.X-Correlation-Id} index={{es.index}} documentId=${header.X-Correlation-Id}'
