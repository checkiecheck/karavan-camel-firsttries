# Test-configuratie voor de route-tests (wint van de productie-properties bij QuarkusTest).
# De RabbitMQ-consumer en Elasticsearch-producer worden geadviced naar
# direct:mock-source / direct:mock-es-index — geen broker of ES nodig.
rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.vhost=/
rabbitmq.exchange=orders.events
rabbitmq.queue=orders-to-elastic
rabbitmq.routingKey=order.#
rabbitmq.declare=false
rabbitmq.dlx.exchange=orders.events.dlx
rabbitmq.dlx.routingKey=dead
rabbitmq.username=guest
rabbitmq.password=guest

es.clusterName=elastic-cluster
es.host=http://localhost:9200
es.index=orders-test
es.username=testuser
es.password=testpass

quarkus.log.console.json=false
quarkus.log.level=WARN
